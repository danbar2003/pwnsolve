[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnsolve"
version = "0.1.0"
description = "Run pwntools solve scripts locally while the target binary runs (and is debugged via gdbserver) on a remote Linux box."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pwntools"]

[project.scripts]
solveinit = "pwnsolve.cli:init_cmd"
solvesync = "pwnsolve.cli:sync_cmd"
solveconfig = "pwnsolve.cli:config_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwnsolve = ["templates/*.tmpl"]
